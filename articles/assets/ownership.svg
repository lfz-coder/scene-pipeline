<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="光场工坊 · CPU 参数与 GPU 所有权分开"><rect width="1200" height="630" rx="24" fill="#10151f"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#9cb8e0"/></marker></defs><style>text{font-family:system-ui,-apple-system,sans-serif}.title{font-size:30px;fill:#edf4ff;font-weight:700}.name{font-size:20px;fill:#edf4ff;font-weight:600}.desc{font-size:16px;fill:#b8c7df}.label{font-size:14px;fill:#a4b3cd}.arrow{fill:none;stroke:#9cb8e0;stroke-width:2;marker-end:url(#arrow)}</style><text x="50" y="61" class="title">光场工坊 · CPU 参数与 GPU 所有权分开</text><rect x="58" y="107" width="1084" height="116" rx="14" fill="#273347" stroke="#52627c"/><text x="80" y="139" class="name">AssetStore：MaterialLibrary + GPU 资源缓存</text><text x="80" y="171" class="desc">MaterialLibrary 保存 CPU 材质；unique_ptr&lt;IMesh / ITexture&gt; 持有工厂创建的资源</text><path d="M600 226V242" class="arrow"/><rect x="58" y="252" width="1084" height="116" rx="14" fill="#2a3c42" stroke="#52627c"/><text x="80" y="284" class="name">Entity：资源 ID + 独立 Transform</text><text x="80" y="316" class="desc">MeshId / MaterialId 表达引用；多个物体共享几何，位置仍分别保存</text><path d="M600 371V387" class="arrow"/><rect x="58" y="397" width="1084" height="116" rx="14" fill="#3c3153" stroke="#52627c"/><text x="80" y="429" class="name">EditorController：明确共享和克隆的操作</text><text x="80" y="461" class="desc">修改共享材质共同生效；克隆只复制 CPU 参数，网格和纹理继续共享</text><text x="52" y="589" class="desc">工厂注入创建实现；CPU 材质和编辑逻辑可不创建窗口，独立调用。</text></svg>