<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"><rect width="1200" height="630" rx="24" fill="#10151f"/><style>text{font-family:system-ui,-apple-system,sans-serif} .title{font-size:32px;fill:#edf4ff;font-weight:700}.name{font-size:22px;fill:#edf4ff}.desc{font-size:15px;fill:#aebdd5}</style><text x="54" y="66" class="title">LUMA · 一个软件，按学习阶段增长</text><rect x="58" y="108" width="1084" height="99" rx="15" fill="#273347" stroke="#52627c"/><text x="88" y="147" class="name">第一阶段 / Foundation</text><text x="88" y="180" class="desc">资源封装、纹理、MVP、相机和状态实验 → 基础可编辑工作台</text><path d="M600 208v22m-6-6 6 6 6-6" fill="none" stroke="#a9c9f6" stroke-width="2"/><rect x="58" y="236" width="1084" height="99" rx="15" fill="#2a3c42" stroke="#52627c"/><text x="88" y="275" class="name">第二、三阶段 / Scene Rendering</text><text x="88" y="308" class="desc">光照与风格、FBO 滤镜、模型、天空盒、阴影与实例化</text><path d="M600 336v22m-6-6 6 6 6-6" fill="none" stroke="#a9c9f6" stroke-width="2"/><rect x="58" y="364" width="1084" height="99" rx="15" fill="#3c3153" stroke="#52627c"/><text x="88" y="403" class="name">第四阶段与产品化 / Advanced + Product</text><text x="88" y="436" class="desc">HDR / Bloom / PBR、动画；工程存档、撤销、资源浏览</text><text x="60" y="588" class="desc">每一阶段都给同一款软件增加可操作的功能，而不是重新建一个孤立 Demo。</text></svg>