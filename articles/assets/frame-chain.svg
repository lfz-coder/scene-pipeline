<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="光场工坊 · 从编辑操作到一次绘制"><rect width="1200" height="630" rx="24" fill="#10151f"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#9cb8e0"/></marker></defs><style>text{font-family:system-ui,-apple-system,sans-serif}.title{font-size:30px;fill:#edf4ff;font-weight:700}.name{font-size:20px;fill:#edf4ff;font-weight:600}.desc{font-size:16px;fill:#b8c7df}.label{font-size:14px;fill:#a4b3cd}.arrow{fill:none;stroke:#9cb8e0;stroke-width:2;marker-end:url(#arrow)}</style><text x="50" y="61" class="title">光场工坊 · 从编辑操作到一次绘制</text><rect x="58" y="107" width="1084" height="116" rx="14" fill="#273347" stroke="#52627c"/><text x="80" y="139" class="name">EditorUI / 无窗口程序 → EditorController</text><text x="80" y="171" class="desc">读取 EditorModel；验证变换与材质副本，提交到 Scene / MaterialLibrary</text><path d="M600 226V242" class="arrow"/><rect x="58" y="252" width="1084" height="116" rx="14" fill="#2a3c42" stroke="#52627c"/><text x="80" y="284" class="name">Application → Renderer + RenderState</text><text x="80" y="316" class="desc">应用风格和渲染偏好；读取 Transform / Camera；构建不透明与透明队列</text><path d="M600 371V387" class="arrow"/><rect x="58" y="397" width="1084" height="116" rx="14" fill="#3c3153" stroke="#52627c"/><text x="80" y="429" class="name">IShader / ITexture / IMesh → 自写包装 → OpenGL</text><text x="80" y="461" class="desc">上传 MVP / 材质参数 → 绑定纹理单元 → draw → 最终输出编码</text><text x="52" y="589" class="desc">Camera 不读取 GLFW；控制器不调用 OpenGL；Renderer 不处理属性控件。</text></svg>