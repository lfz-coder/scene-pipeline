<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="光场工坊 · 工厂契约连接现有 OpenGL 链路"><rect width="1200" height="630" rx="24" fill="#10151f"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#9cb8e0"/></marker></defs><style>text{font-family:system-ui,-apple-system,sans-serif}.title{font-size:30px;fill:#edf4ff;font-weight:700}.name{font-size:20px;fill:#edf4ff;font-weight:600}.desc{font-size:16px;fill:#b8c7df}.label{font-size:14px;fill:#a4b3cd}.arrow{fill:none;stroke:#9cb8e0;stroke-width:2;marker-end:url(#arrow)}</style><text x="50" y="61" class="title">光场工坊 · 工厂契约连接现有 OpenGL 链路</text><rect x="58" y="107" width="1084" height="116" rx="14" fill="#273347" stroke="#52627c"/><text x="80" y="139" class="name">CPU 输入 → IResourceFactory</text><text x="80" y="171" class="desc">GLSL 文件 / MeshData / 图片路径与 TextureOptions；调用端不选择具体包装类</text><path d="M600 226V242" class="arrow"/><rect x="58" y="252" width="1084" height="116" rx="14" fill="#2a3c42" stroke="#52627c"/><text x="80" y="284" class="name">NativeResourceFactory → 自写 GPU 包装</text><text x="80" y="316" class="desc">ShaderProgram 编译链接；Mesh 上传 VAO / VBO / EBO；Texture2D 解码与上传</text><path d="M600 371V387" class="arrow"/><rect x="58" y="397" width="1084" height="116" rx="14" fill="#3c3153" stroke="#52627c"/><text x="80" y="429" class="name">IShader / ITexture / IMesh → 资源使用</text><text x="80" y="461" class="desc">use + uniforms → bind texture unit → draw；适配对象委托现有实现</text><text x="52" y="589" class="desc">资源工厂没有替代所有 GL 状态算法；原生资源的失败清理与移动语义继续验证。</text></svg>