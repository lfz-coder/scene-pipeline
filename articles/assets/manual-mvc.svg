<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="470" viewBox="0 0 1100 470"><rect width="1100" height="470" rx="20" fill="#15151d"/><g font-family="system-ui,PingFang SC" fill="#eee6f8"><text x="40" y="52" font-size="24" font-weight="600">界面组织操作，控制器修改数据，视口拥有上下文</text><g stroke="#665071" fill="#30263f"><rect x="40" y="90" width="300" height="82" rx="12"/><rect x="400" y="90" width="300" height="82" rx="12"/><rect x="760" y="90" width="300" height="82" rx="12"/><rect x="400" y="220" width="300" height="82" rx="12"/><rect x="760" y="220" width="300" height="82" rx="12"/><rect x="40" y="220" width="300" height="82" rx="12"/></g><g font-size="19" text-anchor="middle"><text x="190" y="126">Qt 页面 / 人工操作</text><text x="190" y="152" fill="#aaa3b6" font-size="14">工作台 · 首页 · 镜头 · 作品</text><text x="550" y="126">EditorController</text><text x="550" y="152" fill="#aaa3b6" font-size="14">验证与提交场景操作</text><text x="910" y="126">EditorModel</text><text x="910" y="152" fill="#aaa3b6" font-size="14">Scene / Material / Camera</text><text x="190" y="257">WorkflowState</text><text x="190" y="284" fill="#aaa3b6" font-size="14">确认顺序与下游失效</text><text x="550" y="257">QtViewport</text><text x="550" y="284" fill="#aaa3b6" font-size="14">输入 / 当前上下文 / 输出 FBO</text><text x="910" y="257">Renderer + 自有资源封装</text><text x="910" y="284" fill="#aaa3b6" font-size="14">Mesh / Shader / Texture</text></g><g stroke="#c9aff0" stroke-width="2" fill="none"><path d="M340 131H390M700 131H750M190 172V210M550 172V210M910 172V210M700 261H750"/></g><text x="40" y="372" font-size="18">未来自动执行器：调用相同 Controller，遵守相同 WorkflowState 规则。</text><text x="40" y="410" font-size="16" fill="#aaa3b6">本轮没有 AI SDK、网络任务调度或后台线程；Qt JSON 适配器不写入 GPU 句柄。</text></g></svg>
