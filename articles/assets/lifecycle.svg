<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"><rect width="1200" height="630" rx="24" fill="#10151f"/><style>text{font-family:system-ui,-apple-system,sans-serif} .title{font-size:32px;fill:#edf4ff;font-weight:700}.name{font-size:22px;fill:#edf4ff}.desc{font-size:15px;fill:#aebdd5}</style><text x="54" y="66" class="title">LUMA · 创建和清理必须有顺序</text><rect x="58" y="108" width="1084" height="99" rx="15" fill="#273347" stroke="#52627c"/><text x="88" y="147" class="name">创建 / Initialize</text><text x="88" y="180" class="desc">GLFW → Window → current context → GLAD → GPU resources → Scene</text><path d="M600 208v22m-6-6 6 6 6-6" fill="none" stroke="#a9c9f6" stroke-width="2"/><rect x="58" y="236" width="1084" height="99" rx="15" fill="#2a3c42" stroke="#52627c"/><text x="88" y="275" class="name">运行 / Frame</text><text x="88" y="308" class="desc">events → input routing → camera/update → edit → render → UI → swap</text><path d="M600 336v22m-6-6 6 6 6-6" fill="none" stroke="#a9c9f6" stroke-width="2"/><rect x="58" y="364" width="1084" height="99" rx="15" fill="#3c3153" stroke="#52627c"/><text x="88" y="403" class="name">退出 / Cleanup</text><text x="88" y="436" class="desc">Scene callback → UI / GPU resources → Window → GLFW</text><text x="60" y="588" class="desc">RAII 管理所有权；有效 current context 是 GPU 创建和销毁的前提。</text></svg>