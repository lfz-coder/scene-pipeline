<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640"><rect width="1200" height="640" rx="24" fill="#141824"/><g style="font-family:-apple-system,BlinkMacSystemFont,PingFang SC,Arial,sans-serif"><text x="48" y="62" fill="#edf0fb" font-size="30" font-weight="700">第二阶段：编辑数据与 GPU 执行分开</text><text x="48" y="100" fill="#a0aec9" font-size="17">Qt 和未来其他执行者调用同一 Controller；渲染器读取已校验的状态。</text><rect x="48" y="150" width="290" height="145" rx="14" fill="#29213d" stroke="#56617d"/><text x="68" y="189" fill="#f2f3fc" font-size="21" font-weight="600">View / Qt 页面</text><text x="68" y="222" fill="#c4cee3" font-size="16">表单、选择、操作记录</text><text x="68" y="247" fill="#c4cee3" font-size="16">不创建纹理，不绑定 FBO</text><rect x="455" y="150" width="290" height="145" rx="14" fill="#22334b" stroke="#56617d"/><text x="475" y="189" fill="#f2f3fc" font-size="21" font-weight="600">EditorController</text><text x="475" y="222" fill="#c4cee3" font-size="16">校验候选值后提交</text><text x="475" y="247" fill="#c4cee3" font-size="16">灯光、材质、后处理命令</text><rect x="862" y="150" width="290" height="145" rx="14" fill="#213b3b" stroke="#56617d"/><text x="882" y="189" fill="#f2f3fc" font-size="21" font-weight="600">EditorModel / CPU</text><text x="882" y="222" fill="#c4cee3" font-size="16">LightRig / MaterialDesc</text><text x="882" y="247" fill="#c4cee3" font-size="16">Lighting / PostProcessSettings</text><rect x="48" y="370" width="290" height="150" rx="14" fill="#29213d" stroke="#56617d"/><text x="68" y="409" fill="#f2f3fc" font-size="21" font-weight="600">宿主 / QtViewport</text><text x="68" y="442" fill="#c4cee3" font-size="16">current context、实际像素尺寸</text><text x="68" y="467" fill="#c4cee3" font-size="16">将模型配置交给 Renderer</text><rect x="455" y="370" width="290" height="150" rx="14" fill="#22334b" stroke="#56617d"/><text x="475" y="409" fill="#f2f3fc" font-size="21" font-weight="600">Renderer / Pipeline</text><text x="475" y="442" fill="#c4cee3" font-size="16">队列与状态 / LightingPipeline</text><text x="475" y="467" fill="#c4cee3" font-size="16">PostProcessPipeline / 输出</text><rect x="862" y="370" width="290" height="150" rx="14" fill="#213b3b" stroke="#56617d"/><text x="882" y="409" fill="#f2f3fc" font-size="21" font-weight="600">自己的 OpenGL 封装</text><text x="882" y="442" fill="#c4cee3" font-size="16">Shader / Mesh / Texture</text><text x="882" y="467" fill="#c4cee3" font-size="16">IResourceFactory 可替换</text><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#b4a2ef"/></marker></defs><path d="M338 215L450 215" stroke="#b4a2ef" stroke-width="2" marker-end="url(#a)"/><path d="M745 215L858 215" stroke="#b4a2ef" stroke-width="2" marker-end="url(#a)"/><path d="M1007 295L600 363" stroke="#b4a2ef" stroke-width="2" marker-end="url(#a)"/><text x="813.5" y="319.0" fill="#adb9d2" font-size="14">读取</text><path d="M338 445L450 445" stroke="#b4a2ef" stroke-width="2" marker-end="url(#a)"/><path d="M745 445L858 445" stroke="#b4a2ef" stroke-width="2" marker-end="url(#a)"/><text x="48" y="604" fill="#9daac3" font-size="17">模块边界：CPU 不依赖 Qt / GL；GPU 生命周期由宿主上下文约束。</text></g></svg>