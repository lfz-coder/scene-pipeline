<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640"><rect width="1200" height="640" rx="24" fill="#141824"/><g style="font-family:-apple-system,BlinkMacSystemFont,PingFang SC,Arial,sans-serif"><text x="48" y="62" fill="#edf0fb" font-size="30" font-weight="700">FBO 后处理：直到最后一步才编码到屏幕颜色</text><text x="48" y="100" fill="#a0aec9" font-size="17">RGBA8 线性场景纹理，分离模糊需要两次 pass；None 保持原来的直接输出路径。</text><rect x="48" y="150" width="290" height="145" rx="14" fill="#22334b" stroke="#56617d"/><text x="68" y="189" fill="#f2f3fc" font-size="21" font-weight="600">Scene → Lighting</text><text x="68" y="222" fill="#c4cee3" font-size="16">环境 / 漫反射 / 镜面光</text><text x="68" y="247" fill="#c4cee3" font-size="16">写入 source FBO + 深度模板</text><rect x="455" y="150" width="290" height="145" rx="14" fill="#3c2b43" stroke="#56617d"/><text x="475" y="189" fill="#f2f3fc" font-size="21" font-weight="600">滤镜分派</text><text x="475" y="222" fill="#c4cee3" font-size="16">反相 / 灰度 / 锐化</text><text x="475" y="247" fill="#c4cee3" font-size="16">source → 最终输出</text><rect x="862" y="150" width="290" height="145" rx="14" fill="#213b3b" stroke="#56617d"/><text x="882" y="189" fill="#f2f3fc" font-size="21" font-weight="600">DisplayTarget</text><text x="882" y="222" fill="#c4cee3" font-size="16">Qt FBO 或 GLFW 输出</text><text x="882" y="247" fill="#c4cee3" font-size="16">编码一次，保留深度模板</text><rect x="48" y="370" width="290" height="150" rx="14" fill="#22334b" stroke="#56617d"/><text x="68" y="409" fill="#f2f3fc" font-size="21" font-weight="600">模糊第一遍</text><text x="68" y="442" fill="#c4cee3" font-size="16">水平方向采样 source</text><text x="68" y="467" fill="#c4cee3" font-size="16">输出 scratch：仍在线性空间</text><rect x="455" y="370" width="290" height="150" rx="14" fill="#3c2b43" stroke="#56617d"/><text x="475" y="409" fill="#f2f3fc" font-size="21" font-weight="600">模糊第二遍</text><text x="475" y="442" fill="#c4cee3" font-size="16">垂直方向采样 scratch</text><text x="475" y="467" fill="#c4cee3" font-size="16">不读写同一张纹理</text><rect x="862" y="370" width="290" height="150" rx="14" fill="#213b3b" stroke="#56617d"/><text x="882" y="409" fill="#f2f3fc" font-size="21" font-weight="600">显示转换</text><text x="882" y="442" fill="#c4cee3" font-size="16">sRGB 附件：硬件编码</text><text x="882" y="467" fill="#c4cee3" font-size="16">普通附件：shader 最终编码</text><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#b4a2ef"/></marker></defs><path d="M338 215L450 215" stroke="#b4a2ef" stroke-width="2" marker-end="url(#a)"/><path d="M745 215L858 215" stroke="#b4a2ef" stroke-width="2" marker-end="url(#a)"/><path d="M193 295L193 364" stroke="#b4a2ef" stroke-width="2" marker-end="url(#a)"/><text x="203.0" y="319.5" fill="#adb9d2" font-size="14">Blur</text><path d="M338 445L450 445" stroke="#b4a2ef" stroke-width="2" marker-end="url(#a)"/><path d="M745 445L858 445" stroke="#b4a2ef" stroke-width="2" marker-end="url(#a)"/><path d="M1007 370L1007 302" stroke="#b4a2ef" stroke-width="2" marker-end="url(#a)"/><text x="48" y="604" fill="#9daac3" font-size="17">测试重点：画面方向、双遍颜色编码、resize、深度 / 模板读回、上下文内销毁。</text></g></svg>